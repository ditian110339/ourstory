<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们">
<meta name="format-detection" content="telephone=no">
<title>我们</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ─────────── 门 ─────────── -->
<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <svg class="gate-mark" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 84C50 84 16 62 16 40.5C16 29 24.5 21 35 21C41.8 21 47.3 24.8 50 30.4C52.7 24.8 58.2 21 65 21C75.5 21 84 29 84 40.5C84 62 50 84 50 84Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <p class="gate-kicker">只开给两个人</p>
    <h1 class="gate-title">我们的地方</h1>
    <form id="gate-form" class="gate-form" autocomplete="off">
      <input id="gate-input" class="gate-input" type="password" inputmode="text" placeholder="口令" autocomplete="current-password" required>
      <button class="gate-btn" type="submit">进去</button>
    </form>
    <p id="gate-msg" class="gate-msg"></p>
  </div>
</div>

<!-- ─────────── 主体 ─────────── -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <span class="topbar-date" id="topbar-date"></span>
    <span class="topbar-mode" id="topbar-mode" hidden></span>
  </header>

  <main class="stage">

    <!-- 今天 -->
    <section class="view" id="view-today" data-view="today">
      <div class="today-head">
        <p class="eyebrow">我们在一起</p>
        <div class="counter">
          <span class="counter-num" id="day-count">0</span>
          <span class="counter-unit">天</span>
        </div>
        <p class="today-line" id="today-line"></p>
      </div>

      <div class="milestones" id="milestones"></div>

      <div class="ruler" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="thennow" id="thennow"></div>
    </section>

    <!-- 日历 -->
    <section class="view" id="view-calendar" data-view="calendar" hidden>
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="上个月">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="cal-title" id="cal-title">2026</h2>
        <button class="cal-nav" id="cal-next" aria-label="下个月">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="cal-weekdays" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="cal-hint">点一下某天，看那天留下了什么</p>
      <div class="cal-day" id="cal-day"></div>
    </section>

    <!-- 回忆录 -->
    <section class="view" id="view-album" data-view="album" hidden>
      <div class="album-head">
        <h2 class="album-title">回忆录</h2>
        <p class="album-stats" id="album-stats"></p>
      </div>
      <div id="album-list"></div>
    </section>

    <!-- 添加 -->
    <section class="view" id="view-add" data-view="add" hidden>
      <div class="add-head">
        <h2 class="album-title">添一条</h2>
        <p class="add-sub">那天的照片，那天的我们</p>
      </div>

      <label class="picker" id="picker">
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <svg class="picker-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="7" y="11" width="34" height="26" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17" cy="20" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 33l9-8 6 5 5-4 10 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span class="picker-main">选照片</span>
        <span class="picker-sub">可以从相册选，也能直接拍</span>
      </label>

      <div class="draft" id="draft" hidden>
        <div class="draft-thumbs" id="draft-thumbs"></div>

        <div class="field">
          <label class="field-label" for="draft-date">什么时候</label>
          <input class="field-input" id="draft-date" type="date">
        </div>

        <div class="field">
          <label class="field-label" for="draft-text">当时在干嘛</label>
          <textarea class="field-input field-textarea" id="draft-text" rows="3" placeholder="写下那天的一点什么……"></textarea>
        </div>

        <div class="draft-actions">
          <button class="btn-ghost" id="draft-cancel" type="button">清空</button>
          <button class="btn-solid" id="draft-save" type="button">存进回忆录</button>
        </div>
        <p class="draft-status" id="draft-status"></p>
      </div>
    </section>

  </main>

  <nav class="tabs" id="tabs">
    <a class="tab" href="#today" data-tab="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
      <span>今天</span>
    </a>
    <a class="tab" href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>日历</span>
    </a>
    <a class="tab" href="#album" data-tab="album">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="14" height="12" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 4.5h11.5a2 2 0 0 1 2 2V16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>回忆录</span>
    </a>
    <a class="tab" href="#add" data-tab="add">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>添一条</span>
    </a>
  </nav>

</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="关闭">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div class="lb-inner" id="lb-inner"></div>
</div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
